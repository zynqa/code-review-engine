name: Claude Code Review

on:
  workflow_call:
    inputs:
      magento-version:
        description: 'Magento version (e.g. 2.4.7)'
        required: false
        default: '2.4.7'
        type: string
      strict-mode:
        description: 'Enable stricter review rules'
        required: false
        default: false
        type: boolean
      jira-project-key:
        description: 'Jira project key to fetch ticket context (e.g. ALPHA)'
        required: false
        default: ''
        type: string
      enable-static-analysis:
        description: 'Enable Layer 1 — PHP_CodeSniffer, PHPStan, PHPMD'
        required: false
        default: true
        type: boolean
      enable-ai-review:
        description: 'Enable Layer 2 — Claude AI review'
        required: false
        default: true
        type: boolean
      enable-tests:
        description: 'Enable Layer 3 — PHPUnit test suite'
        required: false
        default: false
        type: boolean
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      JIRA_TOKEN:
        required: false
      JIRA_BASE_URL:
        required: false
      CONFLUENCE_TOKEN:
        required: false
      CONFLUENCE_BASE_URL:
        required: false
      SLACK_TOKEN:
        required: false

jobs:
  # ─────────────────────────────────────────
  # Layer 1 — Static Analysis (always runs if enabled)
  # ─────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    if: inputs.enable-static-analysis == true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover analysis targets
        id: targets
        shell: bash
        run: |
          targets=()
          [ -d src ] && targets+=("src")
          [ -d app/code ] && targets+=("app/code")

          {
            echo "count=${#targets[@]}"
            echo "paths=${targets[*]}"
            echo "csv=$(IFS=,; echo "${targets[*]}")"
          } >> "$GITHUB_OUTPUT"

          if [ ${#targets[@]} -eq 0 ]; then
            echo "No supported analysis targets found. Expected src and/or app/code."
          else
            printf 'Analysis targets: %s\n' "${targets[*]}"
          fi

      - name: Setup PHP
        if: steps.targets.outputs.count != '0'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install analysis tools
        if: steps.targets.outputs.count != '0'
        run: |
          composer global require \
            "squizlabs/php_codesniffer:^3.7" \
            "phpstan/phpstan:^1.10" \
            "phpmd/phpmd:^2.14" \
            "magento/magento-coding-standard:^26" \
            --no-interaction --no-progress

      - name: PHP_CodeSniffer — Magento Coding Standard
        id: phpcs
        if: steps.targets.outputs.count != '0'
        run: |
          set +e
          phpcs --standard=Magento2 \
                --extensions=php \
                --report=json \
                --report-file=phpcs-report.json \
                ${{ steps.targets.outputs.paths }}
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: PHPStan
        id: phpstan
        if: steps.targets.outputs.count != '0'
        run: |
          set +e
          phpstan analyse \
            --level=6 \
            --no-progress \
            --error-format=json \
            ${{ steps.targets.outputs.paths }} > phpstan-report.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: PHP Mess Detector
        id: phpmd
        if: steps.targets.outputs.count != '0'
        run: |
          set +e
          phpmd "${{ steps.targets.outputs.csv }}" xml \
            cleancode,codesize,controversial,design,naming,unusedcode \
            --reportfile phpmd-report.xml
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout review engine
        if: always() && steps.targets.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        if: always() && steps.targets.outputs.count != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish static-analysis findings
        id: static-report
        if: always() && steps.targets.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATIC_REPORTS_DIR: ${{ github.workspace }}
        run: node .code-review-engine/actions/claude-reviewer/src/static-analysis-report.js

      - name: Fail on static-analysis findings
        if: always() && steps.targets.outputs.count != '0'
        run: |
          if [ "${{ steps.static-report.outputs.has_findings }}" = "true" ]; then
            echo "Static analysis found ${{ steps.static-report.outputs.total_findings }} issue(s)."
            exit 1
          fi

          for code in \
            "${{ steps.phpcs.outputs.exit_code }}" \
            "${{ steps.phpstan.outputs.exit_code }}" \
            "${{ steps.phpmd.outputs.exit_code }}"; do
            if [ -n "$code" ] && [ "$code" != "0" ]; then
              echo "Static analysis tool exited with code $code."
              exit 1
            fi
          done

  # ─────────────────────────────────────────
  # Layer 2 — Claude AI Review (skips gracefully if no API key)
  # ─────────────────────────────────────────
  claude-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest
    if: inputs.enable-ai-review == true
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check Claude configuration
        id: claude-config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Anthropic API key is not configured. Skipping AI review."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.claude-config.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout review engine
        if: steps.claude-config.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        if: steps.claude-config.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install reviewer dependencies
        if: steps.claude-config.outputs.skip != 'true'
        working-directory: .code-review-engine/actions/claude-reviewer
        run: npm ci

      - name: Run Claude Reviewer
        if: steps.claude-config.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          MAGENTO_VERSION: ${{ inputs.magento-version }}
          STRICT_MODE: ${{ inputs.strict-mode }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPTS_PATH: ${{ github.workspace }}/.code-review-engine/prompts
          CONFIG_PATH: ${{ github.workspace }}/.code-review-engine/config
        run: node .code-review-engine/actions/claude-reviewer/src/index.js

  # ─────────────────────────────────────────
  # Layer 3 — Tests (opt-in per project)
  # ─────────────────────────────────────────
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    if: inputs.enable-tests == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testsuite unit

  # ─────────────────────────────────────────
  # Layer 4 — Auto-merge gate
  # Waits only on layers that are actually enabled for this project
  # ─────────────────────────────────────────
  auto-merge-gate:
    name: Auto-merge Gate
    runs-on: ubuntu-latest
    needs: [static-analysis, claude-review, tests]
    if: |
      always() &&
      (needs.static-analysis.result == 'success' || needs.static-analysis.result == 'skipped') &&
      (needs.claude-review.result == 'success' || needs.claude-review.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
            } catch (error) {
              if (error.status !== 422 || !String(error.message).includes('There are no new commits on the base branch')) {
                throw error;
              }
              console.log('PR branch is already up to date with the base branch.');
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
            });
