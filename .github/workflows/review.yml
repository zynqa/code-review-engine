name: Claude Code Review

on:
  workflow_call:
    inputs:
      stack:
        description: 'Technology stack under review: magento or laravel. Selects the PHPCS standard, the formatter, and the AI reviewer persona. Defaults to magento so existing callers are unaffected.'
        required: false
        default: 'magento'
        type: string
      php-version:
        description: 'PHP version used for the static-analysis and test jobs'
        required: false
        default: '8.2'
        type: string
      magento-version:
        description: 'Magento version (e.g. 2.4.7). Ignored when stack is not magento.'
        required: false
        default: '2.4.7'
        type: string
      strict-mode:
        description: 'Enable stricter review rules'
        required: false
        default: false
        type: boolean
      jira-project-key:
        description: 'Jira project key to fetch ticket context (e.g. ALPHA)'
        required: false
        default: ''
        type: string
      allowed-jira-project-keys:
        description: 'Comma-separated Jira project keys accepted by PR validation (e.g. DPT,ESHOP3)'
        required: false
        default: ''
        type: string
      enable-pr-validation:
        description: 'Enable PR title, branch, description, and commit message validation'
        required: false
        default: false
        type: boolean
      forbidden-content-patterns:
        description: 'Optional newline-separated content policy patterns in the form "Label::regex" or just "regex"'
        required: false
        default: ''
        type: string
      content-policy-allowed-terms:
        description: 'Optional comma- or newline-separated terms ignored by content policy checks, useful for vendor/tool/module names'
        required: false
        default: ''
        type: string
      enable-auto-approval:
        description: 'Allow the workflow to submit an approval review before merging'
        required: false
        default: false
        type: boolean
      enable-static-analysis:
        description: 'Enable Layer 1 — PHP_CodeSniffer, PHPStan, PHPMD'
        required: false
        default: true
        type: boolean
      enable-module-registration:
        description: 'Enable Magento module registration validation'
        required: false
        default: true
        type: boolean
      enable-ai-review:
        description: 'Enable Layer 2 — Claude AI review'
        required: false
        default: true
        type: boolean
      enable-tests:
        description: 'Enable Layer 3 — PHPUnit test suite'
        required: false
        default: false
        type: boolean
      test-command:
        description: 'Command run by the tests job. Defaults to the Magento-style PHPUnit unit suite; Laravel repos typically pass a Pest command.'
        required: false
        default: 'vendor/bin/phpunit --testsuite unit'
        type: string
      ai-provider:
        description: 'AI backend for the review job (e.g. anthropic). Reserved for when AI review is switched on; the reviewer resolves the provider from this value.'
        required: false
        default: 'anthropic'
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      JIRA_TOKEN:
        required: false
      JIRA_BASE_URL:
        required: false
      CONFLUENCE_TOKEN:
        required: false
      CONFLUENCE_BASE_URL:
        required: false
      SLACK_TOKEN:
        required: false
      AUTOMERGE_APP_ID:
        required: false
      AUTOMERGE_APP_PRIVATE_KEY:
        required: false

jobs:
  pr-validation:
    name: PR Conventions
    runs-on: ubuntu-latest
    if: inputs.enable-pr-validation == true
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout review engine
        uses: actions/checkout@v6
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate PR conventions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
          ALLOWED_JIRA_PROJECT_KEYS: ${{ inputs.allowed-jira-project-keys }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: node .code-review-engine/actions/claude-reviewer/src/pr-validation-check.js

  module-registration:
    name: Magento Module Registration
    runs-on: ubuntu-latest
    if: inputs.enable-module-registration == true
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout review engine
        uses: actions/checkout@v6
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate module registration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .code-review-engine/actions/claude-reviewer/src/module-registration-check.js

  content-policy:
    name: Content Policy
    runs-on: ubuntu-latest
    if: inputs.forbidden-content-patterns != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout review engine
        uses: actions/checkout@v6
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate content policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORBIDDEN_CONTENT_PATTERNS: ${{ inputs.forbidden-content-patterns }}
          CONTENT_POLICY_ALLOWED_TERMS: ${{ inputs.content-policy-allowed-terms }}
        run: node .code-review-engine/actions/claude-reviewer/src/content-policy-check.js

  # ─────────────────────────────────────────
  # Layer 1 — Static Analysis (always runs if enabled)
  # ─────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    if: inputs.enable-static-analysis == true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Collect changed files
        id: changed-files
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            let isStandaloneModuleRepo = false;
            if (fs.existsSync('composer.json') && !fs.existsSync('app/etc/config.php')) {
              try {
                const composerJson = JSON.parse(fs.readFileSync('composer.json', 'utf8'));
                isStandaloneModuleRepo = composerJson.type === 'magento2-module';
              } catch (error) {
                core.warning(`Could not parse composer.json to detect repository type: ${error.message}`);
              }
            }

            const eligibleStatuses = new Set(['added', 'modified', 'renamed', 'copied', 'changed']);
            const phpcsFiles = files
              .filter((file) => eligibleStatuses.has(file.status))
              .map((file) => file.filename)
              .filter((filename) => /\.(php|phtml)$/i.test(filename));
            const isRuntimeAnalysisTarget = (filename) => {
              if (!/\.php$/i.test(filename)) {
                return false;
              }

              const normalized = filename.replace(/\\/g, '/');
              const basename = normalized.split('/').pop().toLowerCase();
              return normalized !== 'app/etc/config.php' &&
                !/\/registration\.php$/i.test(normalized) &&
                basename !== 'deploy.php' &&
                basename !== 'deployer.php';
            };
            const phpFiles = isStandaloneModuleRepo
              ? []
              : phpcsFiles
              .filter(isRuntimeAnalysisTarget);

            core.setOutput('phpcs_paths', phpcsFiles.join(' '));
            core.setOutput('phpcs_count', String(phpcsFiles.length));
            core.setOutput('php_paths', phpFiles.join(' '));
            core.setOutput('php_paths_csv', phpFiles.join(','));
            core.setOutput('php_count', String(phpFiles.length));
            core.setOutput('is_standalone_module_repo', isStandaloneModuleRepo ? 'true' : 'false');

            console.log(`PHPCS targets: ${phpcsFiles.length}`);
            console.log(`PHPStan/PHPMD targets: ${phpFiles.length}`);
            if (isStandaloneModuleRepo) {
              console.log('Detected standalone Magento module repository. PHPStan and PHPMD are skipped because the workflow does not install a full Magento dependency graph for these repos.');
            }

      - name: Checkout review engine
        if: steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0'
        uses: actions/checkout@v6
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup PHP
        if: steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer

      - name: Install analysis tools
        if: steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0'
        run: |
          composer global config audit.block-insecure false

          # The Magento coding standard is only meaningful for the magento stack, and it is a
          # heavy dependency, so Laravel repos do not pull it.
          packages=( \
            "squizlabs/php_codesniffer:^3.7" \
            "phpstan/phpstan:^1.10" \
            "phpmd/phpmd:^2.14" \
          )
          if [ "${{ inputs.stack }}" = "magento" ]; then
            packages+=("magento/magento-coding-standard:^26")
          fi

          composer global require "${packages[@]}" --no-interaction --no-progress

      - name: Install project dependencies for static analysis
        if: steps.changed-files.outputs.php_count != '0' && steps.changed-files.outputs.is_standalone_module_repo != 'true'
        run: |
          if [ ! -f composer.json ]; then
            echo "composer.json not found; skipping project dependency bootstrap."
            exit 0
          fi

          # Applications commit a lock file and are installed from it. Libraries usually do
          # not, and previously that meant no bootstrap at all: PHPStan then ran without an
          # autoloader and reported every framework class as not found. Resolve fresh in that
          # case so the analysis sees real types.
          if [ -f composer.lock ]; then
            composer install \
              --no-interaction \
              --no-progress \
              --no-scripts \
              --prefer-dist \
              --ignore-platform-reqs
          else
            echo "No composer.lock (library repository); resolving dependencies fresh."
            composer update \
              --no-interaction \
              --no-progress \
              --no-scripts \
              --prefer-dist \
              --ignore-platform-reqs
          fi

      - name: Register PHPCS standards
        if: steps.changed-files.outputs.phpcs_count != '0'
        run: |
          COMPOSER_HOME="$(composer global config home)"
          paths="${GITHUB_WORKSPACE}/.code-review-engine/phpcs"

          # Only the magento stack installs (and can therefore register) these.
          if [ "${{ inputs.stack }}" = "magento" ]; then
            paths="${COMPOSER_HOME}/vendor/magento/magento-coding-standard,${COMPOSER_HOME}/vendor/phpcompatibility/php-compatibility,${paths}"
          fi

          phpcs --config-set installed_paths "$paths"
          phpcs -i

      - name: PHP_CodeSniffer
        id: phpcs
        if: steps.changed-files.outputs.phpcs_count != '0'
        run: |
          set +e
          if [ "${{ inputs.stack }}" = "laravel" ]; then
            standard="Laravel"
            extensions="php"
          else
            standard="Magento"
            extensions="php,phtml"
          fi

          phpcs --standard="$standard" \
                --extensions="$extensions" \
                --report=json \
                --report-file=phpcs-report.json \
                ${{ steps.changed-files.outputs.phpcs_paths }}
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Laravel Pint
        id: pint
        if: inputs.stack == 'laravel' && steps.changed-files.outputs.phpcs_count != '0'
        run: |
          set +e
          # Prefer the project's own Pint so CI matches what developers run locally, and
          # picks up the repo's pint.json preset. Fall back to a global install for repos
          # that have not added it yet.
          PINT_BIN="vendor/bin/pint"
          if [ ! -x "$PINT_BIN" ]; then
            composer global require "laravel/pint:^1.13" --no-interaction --no-progress
            PINT_BIN="pint"
          fi

          "$PINT_BIN" --test ${{ steps.changed-files.outputs.phpcs_paths }}
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: PHPStan
        id: phpstan
        if: steps.changed-files.outputs.php_count != '0'
        run: |
          set +e
          PHPSTAN_BIN="phpstan"
          if [ -x vendor/bin/phpstan ]; then
            PHPSTAN_BIN="vendor/bin/phpstan"
          fi

          # Laravel repos are analysed on their own terms: a project that has tuned its level
          # or installed Larastan gets its own config instead of a hardcoded level.
          #
          # Magento keeps --level=6 unconditionally. PHPStan already auto-discovers a root
          # phpstan.neon.dist, and consumers rely on --level=6 overriding the level in it —
          # datapowertools ships one purely to silence autoloader cascades, because this
          # workflow does not install a full Magento dependency graph. Passing
          # --configuration there would drop the override and change what those repos report.
          level_args=(--level=6)
          if [ "${{ inputs.stack }}" = "laravel" ]; then
            for config in phpstan.neon phpstan.neon.dist phpstan.dist.neon; do
              if [ -f "$config" ]; then
                level_args=(--configuration="$config")
                echo "Using PHPStan configuration $config"
                break
              fi
            done
          fi

          "$PHPSTAN_BIN" analyse \
            "${level_args[@]}" \
            --no-progress \
            --error-format=json \
            ${{ steps.changed-files.outputs.php_paths }} > phpstan-report.json
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      # PHPMD stays magento-only. Its default rulesets fire heavily on idiomatic Laravel
      # (short closures, fluent builders, framework base classes), and Laravel repos are
      # already covered by Pint for style and PHPStan for correctness.
      - name: PHP Mess Detector
        id: phpmd
        if: inputs.stack != 'laravel' && steps.changed-files.outputs.php_count != '0'
        run: |
          set +e
          PHPMD_BIN="phpmd"
          if [ -x vendor/bin/phpmd ]; then
            PHPMD_BIN="vendor/bin/phpmd"
          fi

          "$PHPMD_BIN" "${{ steps.changed-files.outputs.php_paths_csv }}" xml \
            cleancode,codesize,controversial,design,naming,unusedcode \
            --reportfile phpmd-report.xml
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Node.js
        if: always() && (steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0')
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Publish static-analysis findings
        id: static-report
        if: always() && (steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATIC_REPORTS_DIR: ${{ github.workspace }}
        run: node .code-review-engine/actions/claude-reviewer/src/static-analysis-report.js

      - name: Fail on static-analysis findings
        if: always() && (steps.changed-files.outputs.phpcs_count != '0' || steps.changed-files.outputs.php_count != '0')
        run: |
          if [ "${{ steps.static-report.outputs.has_findings }}" = "true" ]; then
            echo "Static analysis found ${{ steps.static-report.outputs.total_findings }} issue(s)."
            exit 1
          fi

          # Pint reports by exit code rather than a report file, so it is checked on its own
          # instead of going through the report loop below.
          pint_code="${{ steps.pint.outputs.exit_code }}"
          if [ -n "$pint_code" ] && [ "$pint_code" != "0" ]; then
            echo "Laravel Pint found formatting issues. Run vendor/bin/pint locally and commit the result."
            exit 1
          fi

          for tool in phpcs phpstan phpmd; do
            case "$tool" in
              phpcs)
                code="${{ steps.phpcs.outputs.exit_code }}"
                report="phpcs-report.json"
                ;;
              phpstan)
                code="${{ steps.phpstan.outputs.exit_code }}"
                report="phpstan-report.json"
                ;;
              phpmd)
                code="${{ steps.phpmd.outputs.exit_code }}"
                report="phpmd-report.xml"
                ;;
            esac

            if [ -n "$code" ] && [ "$code" != "0" ] && [ ! -s "$report" ]; then
              echo "Static analysis tool $tool exited with code $code and did not produce a report."
              exit 1
            fi
          done

  # ─────────────────────────────────────────
  # Layer 2 — Claude AI Review (skips gracefully if no API key)
  # ─────────────────────────────────────────
  claude-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest
    if: inputs.enable-ai-review == true
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check Claude configuration
        id: claude-config
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Anthropic API key is not configured. AI review is enabled, so this job cannot run."
            exit 1
          else
            echo "Claude configuration is present."
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout review engine
        uses: actions/checkout@v6
        with:
          repository: zynqa/code-review-engine
          ref: main
          path: .code-review-engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install reviewer dependencies
        working-directory: .code-review-engine/actions/claude-reviewer
        run: npm ci

      - name: Run Claude Reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          MAGENTO_VERSION: ${{ inputs.magento-version }}
          REVIEW_STACK: ${{ inputs.stack }}
          AI_PROVIDER: ${{ inputs.ai-provider }}
          STRICT_MODE: ${{ inputs.strict-mode }}
          JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPTS_PATH: ${{ github.workspace }}/.code-review-engine/prompts
          CONFIG_PATH: ${{ github.workspace }}/.code-review-engine/config
        run: node .code-review-engine/actions/claude-reviewer/src/index.js

  # ─────────────────────────────────────────
  # Layer 3 — Tests (opt-in per project)
  # ─────────────────────────────────────────
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    if: inputs.enable-tests == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: ${{ inputs.test-command }}

  # ─────────────────────────────────────────
  # Layer 4 — Auto-merge gate
  # Waits only on layers that are actually enabled for this project
  # ─────────────────────────────────────────
  auto-merge-gate:
    name: Auto-merge Gate
    runs-on: ubuntu-latest
    needs: [pr-validation, module-registration, content-policy, static-analysis, claude-review, tests]
    if: |
      always() &&
      (
        (inputs.enable-pr-validation == true && needs.pr-validation.result == 'success') ||
        (inputs.enable-pr-validation != true && needs.pr-validation.result == 'skipped')
      ) &&
      (
        (inputs.enable-module-registration == true && needs.module-registration.result == 'success') ||
        (inputs.enable-module-registration != true && needs.module-registration.result == 'skipped')
      ) &&
      (
        (inputs.forbidden-content-patterns != '' && needs.content-policy.result == 'success') ||
        (inputs.forbidden-content-patterns == '' && needs.content-policy.result == 'skipped')
      ) &&
      (
        (inputs.enable-static-analysis == true && needs.static-analysis.result == 'success') ||
        (inputs.enable-static-analysis != true && needs.static-analysis.result == 'skipped')
      ) &&
      (
        (inputs.enable-ai-review == true && needs.claude-review.result == 'success') ||
        (inputs.enable-ai-review != true && needs.claude-review.result == 'skipped')
      ) &&
      (
        (inputs.enable-tests == true && needs.tests.result == 'success') ||
        (inputs.enable-tests != true && needs.tests.result == 'skipped')
      )
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { data: repository } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const mergeMethods = [
              repository.allow_merge_commit ? 'merge' : null,
              repository.allow_squash_merge ? 'squash' : null,
              repository.allow_rebase_merge ? 'rebase' : null,
            ].filter(Boolean);

            if (mergeMethods.length === 0) {
              throw new Error('No merge methods are enabled for this repository.');
            }

            const isMergeMethodRejected = (message) =>
              message.includes('merging is not allowed on this repository') ||
              message.includes('Merge method');

            if (${{ inputs.enable-auto-approval }}) {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });

              const latestStatesByAuthor = new Map();
              for (const review of reviews) {
                if (!review.user || !review.user.login) {
                  continue;
                }

                latestStatesByAuthor.set(review.user.login, review.state);
              }

              if (latestStatesByAuthor.get('github-actions[bot]') !== 'APPROVED') {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  event: 'APPROVE',
                  body: 'Automatically approved after all configured review-engine checks passed.',
                });
              }
            }

            let branchUpdated = false;
            try {
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              branchUpdated = true;
            } catch (error) {
              if (error.status !== 422 || !String(error.message).includes('There are no new commits on the base branch')) {
                throw error;
              }
              console.log('PR branch is already up to date with the base branch.');
            }

            const fetchPullRequest = async () => github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    mergeStateStatus
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number,
            });

            let pullRequest = (await fetchPullRequest()).repository.pullRequest;
            const enableAutoMerge = async () => {
              let lastError = null;
              for (const mergeMethod of mergeMethods) {
                try {
                  await github.graphql(`
                    mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                      enablePullRequestAutoMerge(input: {
                        pullRequestId: $pullRequestId
                        mergeMethod: $mergeMethod
                      }) {
                        pullRequest {
                          number
                        }
                      }
                    }
                  `, {
                    pullRequestId: pullRequest.id,
                    mergeMethod: mergeMethod.toUpperCase(),
                  });
                  return;
                } catch (error) {
                  const message = String(error.message || error);
                  if (!isMergeMethodRejected(message)) {
                    throw error;
                  }

                  lastError = error;
                  console.log(`Auto-merge rejected method "${mergeMethod}". Trying next allowed method.`);
                }
              }

              throw lastError;
            };

            const waitForStablePullRequest = async () => {
              let latest = pullRequest;
              for (let attempt = 1; attempt <= 6; attempt++) {
                latest = (await fetchPullRequest()).repository.pullRequest;
                if (latest.mergeStateStatus !== 'UNSTABLE') {
                  return latest;
                }

                console.log(`PR is still unstable after branch update (attempt ${attempt}/6). Waiting 10s...`);
                await new Promise((resolve) => setTimeout(resolve, 10000));
              }

              return latest;
            };

            const tryDirectMerge = async () => {
              let lastError = null;
              for (const mergeMethod of mergeMethods) {
                try {
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    merge_method: mergeMethod,
                  });
                  return;
                } catch (error) {
                  const message = String(error.message || error);
                  if (!isMergeMethodRejected(message)) {
                    throw error;
                  }

                  lastError = error;
                  console.log(`Direct merge rejected method "${mergeMethod}". Trying next allowed method.`);
                }
              }

              throw lastError;
            };

            if (!branchUpdated) {
              try {
                await tryDirectMerge();
                console.log('Pull request merged directly.');
                return;
              } catch (error) {
                const message = String(error.message || error);
                const shouldFallbackToAutoMerge =
                  error.status === 405 ||
                  error.status === 409 ||
                  message.includes('protected ref') ||
                  message.includes('Repository rule violations found') ||
                  message.includes('Head branch is out of date');

                if (!shouldFallbackToAutoMerge) {
                  throw error;
                }

                console.log(`Direct merge is blocked (${message}). Falling back to native auto-merge.`);
              }
            } else {
              console.log('PR branch was updated from the base branch. Waiting for the refreshed head before trying to merge.');
              pullRequest = await waitForStablePullRequest();

              try {
                await tryDirectMerge();
                console.log('Pull request merged directly after branch update.');
                return;
              } catch (error) {
                const message = String(error.message || error);
                const shouldFallbackToAutoMerge =
                  error.status === 405 ||
                  error.status === 409 ||
                  message.includes('protected ref') ||
                  message.includes('Repository rule violations found') ||
                  message.includes('Head branch was modified') ||
                  message.includes('Head branch is out of date');

                if (!shouldFallbackToAutoMerge) {
                  throw error;
                }

                console.log(`Direct merge after branch update is blocked (${message}). Falling back to native auto-merge.`);
              }
            }

            if (!pullRequest.autoMergeRequest) {
              const enableAutoMergeWithRetry = async () => {
                let lastError = null;
                for (let attempt = 1; attempt <= 6; attempt++) {
                  try {
                    await enableAutoMerge();
                    lastError = null;
                    return;
                  } catch (error) {
                    const message = String(error.message || error);
                    if (!message.includes('unstable status')) {
                      throw error;
                    }

                    lastError = error;
                    console.log(`PR is still unstable for auto-merge (attempt ${attempt}/6). Waiting 10s...`);
                    await new Promise((resolve) => setTimeout(resolve, 10000));
                  }
                }

                if (lastError) {
                  throw lastError;
                }
              };

              await enableAutoMergeWithRetry();
            } else {
              console.log('Auto-merge is already enabled for this pull request.');
            }
