name: Claude Code Review

on:
  workflow_call:
    inputs:
      magento-version:
        description: 'Magento version (e.g. 2.4.7)'
        required: false
        default: '2.4.7'
        type: string
      strict-mode:
        description: 'Enable stricter review rules'
        required: false
        default: false
        type: boolean
      jira-project-key:
        description: 'Jira project key to fetch ticket context (e.g. ALPHA)'
        required: false
        default: ''
        type: string
      enable-static-analysis:
        description: 'Enable Layer 1 — PHP_CodeSniffer, PHPStan, PHPMD'
        required: false
        default: true
        type: boolean
      enable-ai-review:
        description: 'Enable Layer 2 — Claude AI review'
        required: false
        default: true
        type: boolean
      enable-tests:
        description: 'Enable Layer 3 — PHPUnit test suite'
        required: false
        default: false
        type: boolean
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      JIRA_TOKEN:
        required: false
      JIRA_BASE_URL:
        required: false
      CONFLUENCE_TOKEN:
        required: false
      CONFLUENCE_BASE_URL:
        required: false
      SLACK_TOKEN:
        required: false

jobs:
  # ─────────────────────────────────────────
  # Layer 1 — Static Analysis (always runs if enabled)
  # ─────────────────────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    if: inputs.enable-static-analysis == true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Install analysis tools
        run: |
          composer global require \
            "squizlabs/php_codesniffer:^3.7" \
            "phpstan/phpstan:^1.10" \
            "phpmd/phpmd:^2.14" \
            "magento/magento-coding-standard:^26" \
            --no-interaction --no-progress

      - name: PHP_CodeSniffer — Magento Coding Standard
        run: |
          phpcs --standard=Magento2 \
                --extensions=php \
                --report=checkstyle \
                --report-file=phpcs-report.xml \
                src/ app/code/ || true
          cs2pr phpcs-report.xml

      - name: PHPStan
        run: |
          phpstan analyse \
            --level=6 \
            --no-progress \
            --error-format=github \
            src/ app/code/ || true

      - name: PHP Mess Detector
        run: |
          phpmd app/code/ github \
            cleancode,codesize,controversial,design,naming,unusedcode || true

  # ─────────────────────────────────────────
  # Layer 2 — Claude AI Review (skips gracefully if no API key)
  # ─────────────────────────────────────────
  claude-review:
    name: Claude AI Code Review
    runs-on: ubuntu-latest
    if: inputs.enable-ai-review == true && secrets.ANTHROPIC_API_KEY != ''
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Reviewer
        uses: zynqa/code-review-engine/actions/claude-reviewer@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          jira-token: ${{ secrets.JIRA_TOKEN }}
          jira-base-url: ${{ secrets.JIRA_BASE_URL }}
          confluence-token: ${{ secrets.CONFLUENCE_TOKEN }}
          confluence-base-url: ${{ secrets.CONFLUENCE_BASE_URL }}
          slack-token: ${{ secrets.SLACK_TOKEN }}
          magento-version: ${{ inputs.magento-version }}
          strict-mode: ${{ inputs.strict-mode }}
          jira-project-key: ${{ inputs.jira-project-key }}
          github-token: ${{ github.token }}

  # ─────────────────────────────────────────
  # Layer 3 — Tests (opt-in per project)
  # ─────────────────────────────────────────
  tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    if: inputs.enable-tests == true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testsuite unit

  # ─────────────────────────────────────────
  # Layer 4 — Auto-merge gate
  # Waits only on layers that are actually enabled for this project
  # ─────────────────────────────────────────
  auto-merge-gate:
    name: Auto-merge Gate
    runs-on: ubuntu-latest
    needs: [static-analysis, claude-review, tests]
    if: |
      always() &&
      (needs.static-analysis.result == 'success' || needs.static-analysis.result == 'skipped') &&
      (needs.claude-review.result == 'success' || needs.claude-review.result == 'skipped') &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.pulls.updateBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
            });
