name: 'Claude Code Reviewer'
description: 'AI-powered code review using Claude with Jira, Confluence and Slack context'

inputs:
  anthropic-api-key:
    description: 'Anthropic API key'
    required: true
  github-token:
    description: 'GitHub token for posting review comments'
    required: true
  jira-token:
    description: 'Jira API token'
    required: false
    default: ''
  jira-base-url:
    description: 'Jira base URL (e.g. https://zynqa.atlassian.net)'
    required: false
    default: ''
  confluence-token:
    description: 'Confluence API token'
    required: false
    default: ''
  confluence-base-url:
    description: 'Confluence base URL'
    required: false
    default: ''
  slack-token:
    description: 'Slack API token'
    required: false
    default: ''
  magento-version:
    description: 'Magento version'
    required: false
    default: '2.4.7'
  strict-mode:
    description: 'Enable strict review mode'
    required: false
    default: 'false'
  jira-project-key:
    description: 'Jira project key override'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci

    - name: Run Claude Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        JIRA_TOKEN: ${{ inputs.jira-token }}
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        CONFLUENCE_TOKEN: ${{ inputs.confluence-token }}
        CONFLUENCE_BASE_URL: ${{ inputs.confluence-base-url }}
        SLACK_TOKEN: ${{ inputs.slack-token }}
        MAGENTO_VERSION: ${{ inputs.magento-version }}
        STRICT_MODE: ${{ inputs.strict-mode }}
        JIRA_PROJECT_KEY: ${{ inputs.jira-project-key }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PROMPTS_PATH: ${{ github.action_path }}/../../prompts
        CONFIG_PATH: ${{ github.action_path }}/../../config
      run: node ${{ github.action_path }}/src/index.js
